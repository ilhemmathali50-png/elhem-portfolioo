<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elhem Matheli | Creative Portfolio Magazine</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#e8ece8;color:#14373a}*{box-sizing:border-box}header{padding:20px 4vw;display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px}main{min-height:75vh;display:grid;place-items:center;padding:20px}.book{width:min(1020px,96vw);min-height:590px;display:grid;grid-template-columns:1fr 1fr;background:#fbf8f1;box-shadow:0 26px 60px #173e4140;perspective:1100px}.page{min-height:590px;padding:38px;position:relative;transition:transform .45s ease;overflow:hidden}.page:first-child{border-right:1px solid #d0d6d0}.tag{letter-spacing:3px;font-size:11px;color:#178b92}.page h1{font-family:Georgia,serif;font-size:clamp(48px,6vw,94px);line-height:.93;letter-spacing:-4px}.page h2{font-family:Georgia,serif;font-size:clamp(36px,4vw,62px)}.page p{line-height:1.7;max-width:380px}.page img{width:100%;height:280px;object-fit:contain;background:#f2ede6}.cover{background:#14373a;color:white;display:flex;flex-direction:column;justify-content:space-between}.cover .tag{color:#7dd3ca}.cover h1{font-size:clamp(50px,6vw,86px)}.folio{position:absolute;bottom:20px;left:38px;font-size:11px;color:#7a8883}.ctrl{display:flex;justify-content:center;align-items:center;gap:25px;padding:18px}button{background:#14373a;color:white;border:0;border-radius:50px;padding:13px 23px;cursor:pointer}button:disabled{opacity:.3}.animate{animation:flip .45s ease}@keyframes flip{50%{transform:rotateY(-7deg);filter:brightness(.86)}}footer{text-align:center;font-size:11px;padding:12px;color:#586966}@media(max-width:700px){.book{display:block;min-height:560px}.page{min-height:560px}.page:first-child{border-right:0}.page:nth-child(2){display:none}.page h1{font-size:65px}.page img{height:300px}}</style></head><body><header><b>ELHEM MATHELI®</b><span>CREATIVE PORTFOLIO • 2026</span></header><main><div class="book" id="book"></div></main><div class="ctrl"><button id="prev">← Précédent</button><span id="count"></span><button id="next">Suivant →</button></div><footer>BRAND IDENTITY · PACKAGING DESIGN · UI/UX</footer><script>const projects=[['HerbTrésor','Branding & étiquettes naturelles','herb-abricot'],['Jus Nour','Packaging de boissons fruitées','jus-lemon'],['ForceClean','Identité de marque & packaging entretien','force-real'],['Fait Maison','Packaging de produits artisanaux tunisiens','fait-bsissa'],['Selected Works','MyBio · El Cap · autres identités','mybio']];const pages=[{cover:true,title:'ELHEM MATHELI.',desc:'BRAND • PACKAGING • UI/UX DESIGNER'},{title:'Design with purpose.',desc:'Je transforme des idées en identités visuelles et en expériences mémorables.'},...projects.map(p=>({title:p[0],desc:p[1],image:p[2]})),{title:'Let’s create together.',desc:'Portfolio de Elhem Matheli · Tunisie'}];let n=0;const mobile=()=>innerWidth<=700;function page(i){let p=pages[i];if(!p)return '<section class="page"></section>';return '<section class="page '+(p.cover?'cover':'')+'"><div class="tag">ELHEM MATHELI / SELECTED WORKS</div><div><h1>'+p.title+'</h1><p>'+p.desc+'</p>'+(p.image?'<img alt="'+p.title+'" src="assets/'+p.image+'.webp" onerror="this.style.display=\'none\'">':'')+'</div><div class="folio">'+String(i+1).padStart(2,'0')+' / '+pages.length+'</div></section>'}function render(){let i=mobile()?n:n*2;document.querySelector('#book').innerHTML=page(i)+(mobile()?'':page(i+1));document.querySelector('#count').textContent=(n+1)+' / '+(mobile()?pages.length:Math.ceil(pages.length/2));document.querySelector('#prev').disabled=n===0;document.querySelector('#next').disabled=n===(mobile()?pages.length:Math.ceil(pages.length/2))-1}function move(d){n=Math.max(0,Math.min((mobile()?pages.length:Math.ceil(pages.length/2))-1,n+d));render();document.querySelector('#book').classList.remove('animate');void document.querySelector('#book').offsetWidth;document.querySelector('#book').classList.add('animate')}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let x=0;document.querySelector('#book').addEventListener('touchstart',e=>x=e.touches[0].clientX);document.querySelector('#book').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)move(d<0?1:-1)});addEventListener('resize',()=>{n=0;render()});render();</script></body></html>
