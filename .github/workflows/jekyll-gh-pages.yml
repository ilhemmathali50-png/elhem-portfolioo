name: Deploy Elhem Portfolio Magazine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q ".github/workflows/elhem-portfolio-magazine.zip" -d /tmp/elhem-magazine
          cp -a /tmp/elhem-magazine/elhem-portfolio-magazine/. _site/
          test -f _site/index.html
          test -f _site/assets/force-real.webp
          echo "Magazine and images ready"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
